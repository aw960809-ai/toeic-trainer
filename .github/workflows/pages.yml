name: Deploy TOEIC Trainer independent PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: toeic-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and contract QA
        run: npm test
      - name: Assemble static project site
        run: |
          mkdir -p _site
          cp -R index.html manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png css js data .nojekyll _site/
          test -s _site/index.html
          test -s _site/js/auto-sync.js
          test -s _site/manifest.webmanifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
